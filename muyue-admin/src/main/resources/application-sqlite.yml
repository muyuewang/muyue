# =========================================================
# 内嵌数据库 SQLite（默认）：无需安装数据库，启动自动建库建表并初始化数据
# 数据文件：项目根目录下 data/muyue.db（删除该目录即可重置）
# =========================================================
spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    # WAL 模式支持并发读；busy_timeout 使写冲突等待而非直接报 SQLITE_BUSY
    url: jdbc:sqlite:./data/muyue.db?journal_mode=WAL&busy_timeout=5000
    hikari:
      connection-test-query: SELECT 1
      # WAL + busy_timeout 下可安全使用少量多连接（读并发不再互相阻塞）
      maximum-pool-size: 4
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite/schema.sql
      data-locations: classpath:db/sqlite/data.sql
      encoding: UTF-8
      separator: ;
      continue-on-error: false

mybatis-plus:
  configuration:
    database-id: sqlite

muyue:
  db-type: sqlite
